name: Desktop UI Prototype

on:
  pull_request:
    paths:
      - "desktop-prototype/**"
      - ".github/workflows/desktop-prototype.yml"
  push:
    branches: [main, 'feat/**']
    paths:
      - "desktop-prototype/**"
      - ".github/workflows/desktop-prototype.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build desktop UI prototype
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-prototype
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
